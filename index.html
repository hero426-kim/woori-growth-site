<style>
:root { color-scheme: light dark; --bg: #ffffff; --fg: #1f2328; --muted: #57606a; --line: #d0d7de; --head: #f6f8fa; --link: #0b62d6; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9da7b3; --line: #30363d; --head: #161b22; --link: #4c9aff; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }

.meta { color: var(--muted); font-size: 0.95rem; }
table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: 0.95rem; }
th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
th { background: var(--head); }
.table-wrap { overflow-x: auto; }
a { color: var(--link); }
.links a { display: block; padding: 12px 0; font-size: 1.05rem; }
footer { margin-top: 40px; color: var(--muted); font-size: 0.85rem; }
